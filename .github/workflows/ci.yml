name: Core correctness
on:
    push:
    pull_request:
permissions:
    contents: read
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    formatting:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
              with:
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: 22
            - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
              with:
                  dotnet-version: 10.0.303
            - run: npm ci --ignore-scripts
            - run: python -m pip install -r scripts/format-requirements.txt
            - shell: pwsh
              run: Save-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery -Path build/format-tools/powershell -Force
            - run: npm run format:check
            - run: npm run contracts:check
    core:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                config: [Debug, Release]
                jit: ['OFF']
                include:
                    - { os: ubuntu-latest, config: Release, jit: 'ON' }
                    - { os: windows-latest, config: Release, jit: 'ON' }
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 22
            - run: npm ci --prefix Presentation/Mplx.Lsp
            - run: npm run build --prefix Presentation/Mplx.Lsp
            - run: npm ci --prefix Presentation/vscode-mplx
            - run: npm run build --prefix Presentation/vscode-mplx
            - run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DMPLX_BUILD_TESTS=ON -DMPLX_WITH_JIT=${{ matrix.jit }} -DMPLX_BUILD_BENCH=ON
            - run: cmake --build build/ci --config ${{ matrix.config }} --parallel 2
            - run: ctest --test-dir build/ci -C ${{ matrix.config }} --output-on-failure
            - shell: bash
              run: |
                  benchmark=build/ci/bin/mplx-compiler-bench
                  if [ "${RUNNER_OS}" = "Windows" ]; then benchmark="$benchmark.exe"; fi
                  node scripts/compiler-benchmark.mjs "$benchmark" build/compiler-report.json 10
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: compiler-${{ matrix.os }}-${{ matrix.config }}-jit-${{ matrix.jit }}
                  path: build/compiler-report.json
                  if-no-files-found: error
                  retention-days: 14
            - run: cmake --install build/ci --config ${{ matrix.config }} --prefix build/install
            - run: cmake -E tar cf ../mplx-${{ matrix.os }}-jit-${{ matrix.jit }}.zip --format=zip .
              if: matrix.config == 'Release'
              working-directory: build/install
            - run: node scripts/artifact-manifest.mjs 0.6.0 build/artifact-manifest.json build/mplx-${{ matrix.os }}-jit-${{ matrix.jit }}.zip
              if: matrix.config == 'Release'
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              if: matrix.config == 'Release'
              with:
                  name: mplx-${{ matrix.os }}-jit-${{ matrix.jit }}
                  path: |
                      build/*.zip
                      build/artifact-manifest.json
                  if-no-files-found: error
                  retention-days: 14
    editor-package:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
              with:
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: 22
            - run: npm ci --prefix Presentation/Mplx.Lsp
            - run: npm run build --prefix Presentation/Mplx.Lsp
            - run: npm ci --prefix Presentation/vscode-mplx
            - run: mkdir -p build
            - run: npm exec --yes --package=@vscode/vsce@4.0.0 -- vsce package --skip-license --out ../../build/mplx-0.6.0.vsix
              working-directory: Presentation/vscode-mplx
            - run: node scripts/artifact-manifest.mjs 0.6.0 build/vsix-manifest.json build/mplx-0.6.0.vsix
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: mplx-vscode
                  path: |
                      build/*.vsix
                      build/vsix-manifest.json
                  if-no-files-found: error
                  retention-days: 14
    sanitizers:
        runs-on: ubuntu-latest
        env:
            CC: clang
            CXX: clang++
            ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
            UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
              with:
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: 22
            - run: npm ci --prefix Presentation/Mplx.Lsp
            - run: npm run build --prefix Presentation/Mplx.Lsp
            - run: cmake -S . -B build/sanitizers -DCMAKE_BUILD_TYPE=Debug -DMPLX_SANITIZERS=ON -DMPLX_WITH_JIT=ON
            - run: cmake --build build/sanitizers --parallel 2
            - run: ctest --test-dir build/sanitizers --output-on-failure
    fuzz-smoke:
        runs-on: ubuntu-latest
        env:
            CC: clang
            CXX: clang++
            ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
            UBSAN_OPTIONS: halt_on_error=1
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
              with:
                  persist-credentials: false
            - run: cmake -S . -B build/fuzz -DCMAKE_BUILD_TYPE=Debug -DMPLX_BUILD_TESTS=OFF -DMPLX_BUILD_FUZZERS=ON -DMPLX_WITH_JIT=ON
            - run: cmake --build build/fuzz --parallel 2
            - run: build/fuzz/bin/mplx-fuzz-source -max_total_time=30 -timeout=5 -max_len=2048 Presentation/fuzz/corpus/source
            - run: build/fuzz/bin/mplx-fuzz-bytecode -max_total_time=30 -timeout=5 -max_len=1024 Presentation/fuzz/corpus/bytecode
            - run: build/fuzz/bin/mplx-fuzz-module -max_total_time=30 -timeout=5 -max_len=16384 Presentation/fuzz/corpus/module
            - run: build/fuzz/bin/mplx-fuzz-workspace -max_total_time=30 -timeout=5 -max_len=8192 Presentation/fuzz/corpus/workspace
            - run: build/fuzz/bin/mplx-fuzz-ir -max_total_time=30 -timeout=5 -max_len=2048 Presentation/fuzz/corpus/ir
            - run: build/fuzz/bin/mplx-fuzz-snapshot -max_total_time=30 -timeout=5 -max_len=32768 Presentation/fuzz/corpus/snapshot
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              if: failure()
              with:
                  name: fuzz-failure-inputs
                  path: |
                      crash-*
                      timeout-*
                      leak-*
                      oom-*
                  if-no-files-found: ignore
                  retention-days: 14
    thread-sanitizer:
        runs-on: ubuntu-latest
        env:
            CC: clang
            CXX: clang++
            TSAN_OPTIONS: halt_on_error=1
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
              with:
                  persist-credentials: false
            - run: cmake -S . -B build/tsan -DCMAKE_BUILD_TYPE=Debug -DMPLX_THREAD_SANITIZER=ON -DMPLX_WITH_JIT=ON
            - run: cmake --build build/tsan --parallel 2
            - run: ctest --test-dir build/tsan -R 'shared-program|embedding-contexts' --output-on-failure
    dotnet:
        strategy:
            matrix:
                include:
                    - { os: windows-latest, native: bin/mplx_native.dll, filename: mplx_native.dll }
                    - { os: ubuntu-latest, native: lib/libmplx_native.so, filename: libmplx_native.so }
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
              with:
                  persist-credentials: false
            - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
              with:
                  dotnet-version: 8.0.x
            - run: cmake -S . -B build/interop -DCMAKE_BUILD_TYPE=Release -DMPLX_BUILD_TESTS=OFF -DMPLX_WITH_JIT=ON
            - run: cmake --build build/interop --config Release --parallel 2
            - run: dotnet run --project Presentation/tests-dotnet -c Release -p:MplxNativePath=${{ github.workspace }}/build/interop/${{ matrix.native }} -p:MplxNativeFileName=${{ matrix.filename }}
